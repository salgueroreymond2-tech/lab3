<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZoFranca CR — Iniciar Sesión</title>
  <link rel="stylesheet" href="./src/styles/registro-movil.css">
  <!-- Librería QRCode -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <h1>ZoFranca CR</h1>
      <p>Sistema de Gestión de Zonas Francas de Costa Rica</p>
    </div>

    <!-- Pestañas para cambiar método de ingreso -->
    <div class="login-tabs">
      <button class="login-tab-btn active" id="tabCredenciales">
        🔒 Credenciales
      </button>
      <button class="login-tab-btn" id="tabQR">
        📱 Escaneo QR
      </button>
    </div>

    <!-- CONTENIDO 1: INGRESO CON CREDENCIALES -->
    <div id="panelCredenciales" class="tab-content">
      <form id="formLoginCredenciales">
        <div class="form-group">
          <label for="usuario">Usuario / Correo Electrónico</label>
          <input type="text" id="usuario" placeholder="ej. analista@procomer.com" required value="analista@procomer.com">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required value="1234">
        </div>

        <div class="form-group">
          <label for="perfilAcceso">Perfil de Acceso</label>
          <select id="perfilAcceso">
            <option value="admin">Analista PROCOMER (Administración)</option>
            <option value="solicitante">Empresa Solicitante (Régimen ZF)</option>
            <option value="gerente">Gerencia de Cumplimiento</option>
          </select>
        </div>

        <button type="submit" class="btn-primary" style="margin-top:8px;">
          Ingresar al Sistema PROCOMER →
        </button>
      </form>


    </div>

    <!-- CONTENIDO 2: INGRESO CON QR MÓVIL -->
    <div id="panelQR" class="tab-content hidden">
      <div class="qr-box-wrapper">
        <p style="font-size:0.85rem; color:var(--text-muted); text-align:center;">
          Escanea el código QR con tu celular para autenticarte instantáneamente
        </p>

        <div id="qrcode" class="qr-box"></div>

        <div class="status-indicator">
          <span class="pulse"></span> Esperando validación desde el móvil...
        </div>

        <a id="linkSimularMovil" href="#" target="_blank" class="btn-secondary" style="font-size:0.8rem; text-decoration:none; text-align:center; margin-top:8px;">
          🔗 Simular Escaneo Móvil en Nueva Pestaña
        </a>
      </div>
    </div>

  </div>

  <script type="module" src="src/js/app-pc.js"></script>
</body>
</html>
