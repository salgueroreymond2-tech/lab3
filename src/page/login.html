<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZoFranca CR — Iniciar Sesión</title>
  <link rel="stylesheet" href="../styles/registro-movil.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <!-- Librería QRCode -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <a href="../../index.html" style="color: var(--primary-color); text-decoration: none; font-size: 0.85rem; font-weight: 600; display: inline-block; margin-bottom: 8px;">← Volver al Inicio Institucional</a>
      <h1>ZoFranca CR</h1>
      <p>Sistema de Gestión de Zonas Francas de Costa Rica</p>
    </div>

    <!-- Pestañas para cambiar método de ingreso -->
    <div class="login-tabs">
      <button class="login-tab-btn active" id="tabCredenciales">
        <span class="material-symbols-outlined" aria-hidden="true">lock</span> Credenciales
      </button>
      <button class="login-tab-btn" id="tabQR">
        <span class="material-symbols-outlined" aria-hidden="true">qr_code_scanner</span> Escaneo QR
      </button>
    </div>

    <!-- CONTENIDO 1: INGRESO CON CREDENCIALES -->
    <div id="panelCredenciales" class="tab-content">
      <form id="formLoginCredenciales" autocomplete="off">
        <div class="form-group">
          <label for="usuario">Usuario / Correo Electrónico</label>
          <input type="text" id="usuario" placeholder="ej. analista@procomer.com" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="••••••••" required autocomplete="new-password">
            <button type="button" class="btn-toggle-password" data-toggle="#password" title="Mostrar u ocultar contraseña"><span class="material-symbols-outlined" aria-hidden="true">visibility</span></button>
          </div>
        </div>

        <button type="submit" class="btn-primary" style="margin-top:8px;">
          Ingresar al Sistema →
        </button>
      </form>


    </div>

    <!-- CONTENIDO 2: INGRESO CON QR MÓVIL -->
    <div id="panelQR" class="tab-content hidden">
      <div class="qr-box-wrapper">
        <p style="font-size:0.85rem; color:var(--text-muted); text-align:center;">
          Escanea el código QR con tu celular para autenticarte instantáneamente
        </p>

        <div id="qrcode" class="qr-box"></div>

        <div class="status-indicator">
          <span class="pulse"></span> Esperando validación desde el móvil...
        </div>

        <a id="linkSimularMovil" href="#" target="_blank" class="btn-secondary" style="font-size:0.8rem; text-decoration:none; text-align:center; margin-top:8px;">
          <span class="material-symbols-outlined" aria-hidden="true">open_in_new</span> Simular Escaneo Móvil en Nueva Pestaña
        </a>
      </div>
    </div>

  </div>

  <script type="module" src="../js/modules/theme.js"></script>
  <script type="module" src="../js/modules/app-pc.js"></script>
</body>
</html>
